vehicle_name: auh
bt_xml: "$(find ros_behavior_tree)/config/test.xml"
loop_frequency: 4.0
trigger_hold_time: 1.0
nav_log_period: 5.0
groot_enable: true
groot_publisher_port: 1666
groot_server_port: 1667

# ROS-style topics
ros_heading_topic: /auh/current_heading
ros_speed_topic: /auh/current_speed
ros_depth_topic: /auh/current_depth
ros_yaw_topic: /auh/current_yaw
ros_pitch_topic: /auh/current_pitch
ros_roll_topic: /auh/current_roll
ros_x_topic: /auh/current_x
ros_y_topic: /auh/current_y
deploy_topic: /auh/DEPLOY
return_topic: /auh/RETURN

# NAV/MOOS-style topics
nav_heading_topic: /auh/NAV_HEADING
nav_speed_topic: /auh/NAV_SPEED
nav_depth_topic: /auh/NAV_DEPTH
nav_yaw_topic: /auh/NAV_YAW
nav_pitch_topic: /auh/NAV_PITCH
nav_roll_topic: /auh/NAV_ROLL
nav_x_topic: /auh/NAV_X
nav_y_topic: /auh/NAV_Y
